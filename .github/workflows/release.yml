name: Release

# Publishes a GitHub Release (installer + latest.json for in-app updates)
# whenever main has a version that hasn't been released yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether this version is already released
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.exists == 'false'
      - uses: swatinem/rust-cache@v2
        if: steps.version.outputs.exists == 'false'
        with:
          workspaces: src-tauri
      - run: npm ci
        if: steps.version.outputs.exists == 'false'
      - name: Clean up the signing key
        # A pasted secret can pick up spaces, line breaks or a second copy of the key.
        # Keep only the first complete key, and check it before the long build.
        if: steps.version.outputs.exists == 'false'
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY=$(printf '%s' "$RAW_KEY" | tr -d ' \r\n\t' | grep -oE '^[A-Za-z0-9+/]+={0,2}' || true)
          if ! printf '%s' "$KEY" | base64 -d 2>/dev/null | grep -q 'untrusted comment'; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing or is not a valid key. Paste the key file's text into it again."
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        if: steps.version.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: MyTodoTracker v__VERSION__
          releaseBody: See the changes in this version below. Install it from inside the app (Settings → Check for updates), or download the setup file.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
